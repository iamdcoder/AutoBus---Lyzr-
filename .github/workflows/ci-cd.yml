name: AutoBus CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt ruff

      - name: Lint Python
        run: python -m ruff check backend agents --select E9,F63,F7,F82

      - name: Compile Python sources
        run: python -m compileall -q backend agents

      - name: Run test suite
        run: python -m pytest -q

  build:
    name: Build deployment image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t autobus-negotiator:${{ github.sha }} .

  deploy-render:
    name: Deploy to Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deployment
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured; skipping Render deployment."
            exit 0
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"
